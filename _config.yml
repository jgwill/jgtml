# GitHub Pages/Jekyll configuration for jgtml documentation site
# Excludes large data directories, Python packages, build artifacts, and configuration files
# that would cause GitHub Pages workflow to fail or take excessive time

exclude:
  # Existing exclusion
  - jgtml_refresh
  
  # Python package and source code (not website content)
  - jgtml/
  - src/
  - tests/
  - scripts/
  - examples/
  - codex/
  
  # Large data directories
  - models/
  - trading_logs/
  - arch/
  - garden_one/
  - book/
  
  # Editor and tool configuration
  - .cursor/
  - .vscode/
  - .jgt/
  - .mia/
  - .cursorignore
  
  # Git and CI configuration
  - .github/
  - .gitignore
  - .git/
  
  # Copilot and agent instructions (internal use)
  - .copilot-instructions*.md
  - .ritual-prompt-instructions.md
  - .seeding-agent-instructions.md
  - .sync_memory.json
  
  # Shell scripts and build files (infrastructure)
  - "_*.sh"
  - "*.sh"
  - "pre-*.sh"
  - "mk-*.sh"
  - "release-*.sh"
  - "__*.sh"
  - "BUILDRELEASETAG.sh"
  - "_*.txt"
  - "_*.json"
  - "_keys.txt"
  - "_keys2.txt"
  
  # Build and package artifacts
  - setup.py
  - pyproject.toml
  - requirements.txt
  - Makefile
  - bump_version.py
  - package.json
  - "*.whl"
  - dist/
  - build/
  
  # Temporary and test files
  - "context*.json"
  - "test_*.py"
  - "test_*.sh"
  - "*_test*.txt"
  - "demo_*.py"
  - "observation_*.py"
  - "alligator_*.py"
  - "m-*.py"
  - "llm*.txt"
  
  # Workspace and IDE files
  - "*.code-workspace"
  
  # Data and sample files
  - sample_settings.json
  - pto-package.csv
  
  # rispecs (specifications) - verbose and technical
  - rispecs/
